# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: portal_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: securepassword123
    volumes:
      # Maps the container's data to your local ./database folder
      - ./database:/data/db

  # Optional but highly recommended: Mongo Express for a web-based DB UI
  mongo-express:
    image: mongo-express
    container_name: portal_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: securepassword123
      ME_CONFIG_MONGODB_URL: mongodb://admin:securepassword123@mongodb:27017/
    depends_on:
      - mongodb