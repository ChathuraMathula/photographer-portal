# docker-compose.yml
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: portal
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: portal_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@photoportal.com
      PGADMIN_DEFAULT_PASSWORD: pgadminsecure123
    depends_on:
      - postgres

  maildev:
    image: maildev/maildev
    container_name: portal_maildev
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: portal_rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  tileserver:
    image: maptiler/tileserver-gl
    container_name: portal_tileserver
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./map-data:/data
    command: -c /data/config.json -p 8080

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: portal_nominatim
    restart: always
    ports:
      - "8081:8080"
    environment:
      PBF_URL: file:///nominatim/data/map.pbf
      REPLICATION_URL: ""
    volumes:
      - ./map-data:/nominatim/data
      - nominatim_data:/var/lib/postgresql/14/main

volumes:
  rabbitmq_data:
  nominatim_data:
