# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: portal
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: portal_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@photoportal.com
      PGADMIN_DEFAULT_PASSWORD: pgadminsecure123
    depends_on:
      - postgres

  maildev:
    image: maildev/maildev
    container_name: portal_maildev
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"